[package]
name = "vykey-biometric"
description = "Fingerprint unlock for vykey: fprintd + the kernel keyring on Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
thiserror = "2.0.21"
vykey-core.workspace = true
zeroize = "1.9.2"

# zbus is already in the tree through Slint's accessibility backend; same
# version and executor (async-io), so this adds no second D-Bus stack.
[target.'cfg(target_os = "linux")'.dependencies]
async-channel = "2.5.0"
async-io = "2.6.0"
futures-lite = "2.6.1"
linux-keyutils = { version = "0.2.5", features = ["std"] }
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

[lints]
workspace = true
