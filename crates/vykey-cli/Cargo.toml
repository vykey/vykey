[package]
name = "vykey-cli"
description = "Terminal client for the vykey password manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "vy"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
ratatui = "0.30.2"
rpassword = "7.5.4"
vykey-biometric.workspace = true
vykey-core.workspace = true
zeroize = "1.9.2"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
