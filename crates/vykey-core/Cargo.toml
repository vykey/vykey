[package]
name = "vykey-core"
description = "Vault format, crypto and storage for vykey (compatible with the Go implementation)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
data-encoding = "2.11.1"
hmac = "0.13.0"
rand = "0.10.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
thiserror = "2.0.21"
uuid = { version = "1.29.3", features = ["v4"] }
zeroize = { version = "1.9.2", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
